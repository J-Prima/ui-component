name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout full Git history for Chromatic
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 5️⃣ Lint code
      - name: Lint
        run: npm run lint

      # 6️⃣ Type checking
      - name: Type Check
        run: npm run typecheck

      # 7️⃣ Unit tests with coverage
      - name: Unit Tests
        run: npm run test -- --coverage

      # 8️⃣ Build Vite library
      - name: Build Library
        run: npm run build

      # 9️⃣ Build Storybook
      - name: Build Storybook
        run: npm run build-storybook

      # 🔟 Publish to Chromatic
      - name: Publish to Chromatic
        uses: chromaui/action@v1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitOnceUploaded: true

  sonar-analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2️⃣ Download and install SonarScanner CLI v7.3.0
      - name: Install SonarScanner CLI
        run: |
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-7.3.0.5189-linux-x64.zip
          unzip sonar-scanner.zip
          mv sonar-scanner-7.3.0.5189-linux-x64 sonar-scanner
          echo "$PWD/sonar-scanner/bin" >> $GITHUB_PATH

      # 3️⃣ Run SonarQube analysis
      - name: Run SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=ui-library \
            -Dsonar.sources=src \
            -Dsonar.tests=src \
            -Dsonar.test.inclusions=**/*.test.{js,jsx,ts,tsx} \
            -Dsonar.exclusions=**/node_modules/**,**/*.spec.{js,jsx,ts,tsx} \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      # 4️⃣ Enforce Quality Gate (optional but recommended)
      - name: Check Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          PROJECT_KEY="ui-library"
          ANALYSIS_ID=$(curl -s -u $SONAR_TOKEN: "${{ secrets.SONAR_HOST_URL }}/api/ce/component?component=$PROJECT_KEY" | jq -r '.current.id')
          sleep 10  # wait for analysis to complete
          STATUS=$(curl -s -u $SONAR_TOKEN: "${{ secrets.SONAR_HOST_URL }}/api/qualitygates/project_status?analysisId=$ANALYSIS_ID" | jq -r '.projectStatus.status')
          if [ "$STATUS" != "OK" ]; then
            echo "❌ Quality Gate failed: $STATUS"
            exit 1
          else
            echo "✅ Quality Gate passed"
          fi